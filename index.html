<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Work Shift Dashboard</title>
<style>
:root { color-scheme: dark; }
html, body { margin:0; height:100%; background:#0b0d12; font-family:-apple-system, system-ui, Segoe UI, Roboto, Arial, sans-serif; overflow:hidden; }
* { box-sizing:border-box; }

.wrap { height:100dvh; }
.app {
  width:100vw;
  height:100dvh;
  background:linear-gradient(135deg, #1a1f2b, #10141c);
  border-radius:0;
  display:flex;
  flex-direction:column;
}

header{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.10);
}
.title h1{ margin:0; font-size:20px; font-weight:900; }
.subtitle{ font-size:13px; opacity:.75; font-weight:700; }
.build{ font-size:12px; opacity:.6; font-weight:700; }

main{ flex:1; overflow:hidden; }
.view{ height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; }
.card{ border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.05); border-radius:16px; padding:12px; margin-bottom:12px; }
.card h2{ margin:0 0 8px; font-size:16px; }

.timeline{ display:grid; gap:10px; }
.phase{
  padding:10px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.2);
}
.phase.active{
  border-color:rgba(183,255,207,.6);
  background:rgba(183,255,207,.12);
}
.phase h3{ margin:0 0 4px; font-size:15px; }
.phase p{ margin:0; font-size:13px; opacity:.8; }

.tabs{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:8px;
  padding:12px calc(12px + env(safe-area-inset-bottom)) 12px 12px;
  border-top:1px solid rgba(255,255,255,.10);
}
.tab{
  padding:12px 6px;
  font-weight:900;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#e9ecf2;
}
.tab.active{ background:rgba(255,255,255,.16); }
</style>
</head>
<body>
<div class="wrap">
  <div class="app">
    <header>
      <div class="title">
        <h1>Work Shift Dashboard</h1>
        <div class="subtitle" id="shiftLine"></div>
        <div class="build">Build v1.1.0</div>
      </div>
    </header>

    <main>
      <section class="view">
        <div class="card">
          <h2>Shift Timeline</h2>
          <div class="timeline" id="timeline"></div>
        </div>
      </section>
    </main>

    <nav class="tabs">
      <button class="tab active">Home</button>
      <button class="tab">Daily</button>
      <button class="tab">Weekly</button>
    </nav>
  </div>
</div>

<script>
const phases = [
  {name:"Start of Shift", desc:"Momentum tasks and setup"},
  {name:"Mid-Shift", desc:"Core workload"},
  {name:"Last Hour", desc:"Wrap-up and resets"},
  {name:"Shutdown", desc:"Leave tomorrow easier"}
];

function currentPhase(){
  const h = new Date().getHours();
  if (h < 16) return 0;
  if (h < 19) return 1;
  if (h < 21) return 2;
  return 3;
}

document.getElementById("shiftLine").textContent =
  new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});

const tl = document.getElementById("timeline");
const active = currentPhase();
phases.forEach((p,i)=>{
  const d = document.createElement("div");
  d.className = "phase" + (i===active ? " active":"");
  d.innerHTML = `<h3>${p.name}</h3><p>${p.desc}</p>`;
  tl.appendChild(d);
});
</script>
</body>
</html>
